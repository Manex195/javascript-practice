<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=, initial-scale=1.0">
  <title>Api exercise</title>
</head>
<body>
  <div class="container">
    <button id="show-data">Load Data</button>
  </div>


  <script>

    document.querySelector("#show-data").addEventListener("click", () => {
      loadData();
    });

    let loadData = async() => {
      try {
        const data = await fetch("https://jsonplaceholder.typicode.com/users");

        if (!data.ok) {
          return Error("Error " + data.status);
        }
        
        const jdata = await data.json();

        jdata.forEach(element => {
          const p = document.createElement("p");
          p.textContent = `${element.name} - ${element.email}`;
          document.body.appendChild(p);
        });

      } catch(error) {
        console.log(error)
      }
    };

  </script>
</body>
</html>
